// WorkshopBridge Java backend.
//
// Build requirements (compile-only, provided at runtime):
//   1. ZombieBuddy.jar  -> put it in java-src/libs/
//   2. PZ game classes  -> pass -PpzJavaDir=<path> (the game's Java directory,
//      e.g. ".../ProjectZomboid/Contents/Java" on macOS; the folder holding the
//      game's compiled classes on Windows/Linux). Defaults to libs/pz-java.
//
// Then:
//   gradle -PpzJavaDir="<path-to-game-java>" installJar
//
// The JAR lands at WorkshopBridge/42/media/java/WorkshopBridge.jar, matching
// javaJarFile in common/mod.info. Target Java 17 bytecode (runs on 17+).

plugins {
    id 'java'
}

def zbJar = file('libs/ZombieBuddy.jar')
def pzJavaDir = project.hasProperty('pzJavaDir') ? project.property('pzJavaDir') : 'libs/pz-java'

// Fail fast with an actionable message instead of cryptic "package does not
// exist" errors when the game classes aren't where expected.
def pzHasGameClasses(String loc) {
    def f = file(loc)
    if (new File(f, 'zombie/ZomboidFileSystem.class').isFile()) return true
    if (f.isFile() && loc.endsWith('.jar')) {
        def zip = new java.util.zip.ZipFile(f)
        try {
            return zip.getEntry('zombie/ZomboidFileSystem.class') != null
        } finally {
            zip.close()
        }
    }
    return false
}
if (!zbJar.isFile()) {
    throw new GradleException(
        "Missing ${zbJar}: build ZombieBuddy (./gradlew shadowJar) and copy the\n" +
        "result to WorkshopBridge/java-src/libs/ZombieBuddy.jar (see java-src/README.md).")
}
if (!pzHasGameClasses(pzJavaDir)) {
    throw new GradleException(
        "PZ game classes not found under pzJavaDir=${pzJavaDir}.\n" +
        "Point -PpzJavaDir at the folder containing zombie/ZomboidFileSystem.class\n" +
        "(or the .jar containing it). Find it with:\n" +
        "  find <game-install-dir> -name ZomboidFileSystem.class 2>/dev/null")
}

dependencies {
    compileOnly files(zbJar)
    compileOnly files(pzJavaDir)
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    archiveBaseName = 'WorkshopBridge'
}

// Copies the built JAR into the mod's 42/media/java layout.
tasks.register('installJar', Copy) {
    dependsOn jar
    from jar.archiveFile
    into file('../42/media/java')
    rename { 'WorkshopBridge.jar' }
}
